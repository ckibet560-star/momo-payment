<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Starlink Renewal</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    }
    body {
      background-color: #0b0b0b;
      color: #ffffff;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      padding: 20px;
    }
    .card {
      background: #141414;
      border: 1px solid #222;
      border-radius: 12px;
      padding: 30px 24px;
      width: 100%;
      max-width: 420px;
      box-shadow: 0 10px 30px rgba(0, 0, 0, 0.5);
    }
    .amount {
      text-align: center;
      font-size: 32px;
      font-weight: 800;
      margin-bottom: 4px;
    }
    .subtitle {
      text-align: center;
      color: #888;
      font-size: 14px;
      margin-bottom: 28px;
    }
    .form-group {
      margin-bottom: 18px;
    }
    label {
      display: block;
      font-size: 13px;
      color: #aaa;
      margin-bottom: 8px;
    }
    .input-wrapper {
      display: flex;
      background: #1c1c1c;
      border: 1px solid #333;
      border-radius: 8px;
      overflow: hidden;
    }
    .prefix {
      padding: 12px 14px;
      background: #252525;
      color: #aaa;
      font-size: 14px;
      border-right: 1px solid #333;
      display: flex;
      align-items: center;
      justify-content: center;
    }
    input {
      width: 100%;
      background: transparent;
      border: none;
      padding: 12px 14px;
      color: #fff;
      font-size: 15px;
      outline: none;
    }
    button {
      width: 100%;
      background: #d4af37;
      color: #000;
      border: none;
      padding: 14px;
      font-weight: 700;
      font-size: 15px;
      border-radius: 8px;
      cursor: pointer;
      margin-top: 10px;
      transition: background 0.2s;
    }
    button:hover {
      background: #e5be3e;
    }
    button:disabled {
      background: #555;
      cursor: not-allowed;
    }
  </style>
</head>
<body>

  <div class="card">
    <div class="amount">ZMW 25.00</div>
    <div class="subtitle">Service: Starlink Renewal</div>

    <form id="paymentForm">
      <div class="form-group">
        <label for="phone">MTN MoMo Number</label>
        <div class="input-wrapper">
          <div class="prefix">ZM +260</div>
          <input type="tel" id="phone" placeholder="907877678" required>
        </div>
      </div>

      <button type="submit" id="submitBtn">Pay ZMW 25.00</button>
    </form>
  </div>

  <script>
    // Live Render backend URL
    const BACKEND_URL = 'https://momo-payment-f3g6.onrender.com';

    const form = document.getElementById('paymentForm');
    const submitBtn = document.getElementById('submitBtn');

    form.addEventListener('submit', async (e) => {
      e.preventDefault();
      
      const phoneInput = document.getElementById('phone').value.trim();
      const fullPhone = '+260' + phoneInput;

      submitBtn.disabled = true;
      submitBtn.innerText = 'Processing...';

      try {
        const response = await fetch(`${BACKEND_URL}/api/request-payment`, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({
            phone: fullPhone,
            plan: 'Standard Plan',
            amount: 'ZMW 25.00'
          })
        });

        const data = await response.json();

        if (response.ok && data.success) {
          alert('Payment request submitted successfully.');
        } else {
          alert('Server error. Please try again.');
        }
      } catch (error) {
        console.error('Network Error:', error);
        alert('Server connection error. Please try again.');
      } finally {
        submitBtn.disabled = false;
        submitBtn.innerText = 'Pay ZMW 25.00';
      }
    });
  </script>

</body>
</html>
